top:
  overskrift: Bliv gast på Mango
  undertekst: Alt, du skal vide om livet ombord, økonomi, sikkerhed og hvordan du kommer med.
  video: /billeder/jungleflod-drone.mp4
  billede: /billeder/jungleflod-poster.jpg
indholdsfortegnelse_titel: Hop direkte til
livet:
  overskrift: Livet som gast på Mango
  fremhaevet: Forestil dig at vågne op i en lille bugt, hoppe direkte i det blå vand og spise morgenmad med udsigt til en ø, du måske aldrig havde hørt om før. Det er det liv, vi gerne vil dele med dig på Mango.
  tekst: |-
    Vi oplever steder, mennesker og kulturer, som man sjældent kommer tæt på som almindelig turist. Nogle dage er vi på vej mod nye perler i paradis. Andre dage bliver vi liggende, fordi vi har fundet et sted, der er liiidt for godt til at forlade.

    Undervejs bruger vi tid på snorkling, dykning, vandreture, lokale markeder, små landsbyer, solnedgange, surfing og alt det uventede, der opstår, når man rejser på havet med andre eventyrlystne mennesker.

    Som gast bliver du en del af livet ombord. Du behøver ikke have sejlet før, men du skal have lyst til at være med, og vi ser gerne, at du er nysgerrig på at lære. Mango er vores hjem, og i den periode du er med, bliver det også dit. Vi deler oplevelserne, hverdagen og ansvaret for at få det hele til at fungere.

    Det er ikke en charterferie, hvor nogen står klar med en serveringsbakke. Til gengæld får du mulighed for at opleve langturssejlads indefra, lære noget nyt og blive en del af et fællesskab, hvor vi skaber rejsen sammen.

    Nogle dage er fulde af eventyr, mens andre dage kan gå med indkøb, rengøring eller en bog i skyggen. Vi tror på, at det er blandingen, der gør livet på havet til noget særligt. Og selv opvasken bliver lidt hyggeligere, når musikken spiller, og udsigten er palmer, moana-blåt vand og en solnedgang i horisonten.
  billede: /billeder/solnedgang-strand.jpg
faellesskab:
  overskrift: Fællesskab og forventninger
  tekst: |-
    Når man bor sammen på en sejlbåd, kommer man hurtigt tæt på hinanden. Vi deler få kvadratmeter og en hverdag, hvor man må tage del i et fællesskab. Derfor betyder det meget for os, hvem vi får med ombord.

    Vi forventer ikke, at alle er ens, eller at vi skal lave alting sammen. Der skal være plads til forskellige personligheder, interesser og behov for alenetid. Men vi forventer, at alle bidrager til et fællesskab, hvor man hjælper hinanden, tager hensyn og siger tingene højt, inden små irritationer vokser sig store.

    De daglige opgaver deler vi mellem os. Der skal laves mad, vaskes op, handles ind, gøres rent og indimellem gives en hånd med vedligeholdelse. Det er ikke nødvendigt at kunne det hele på forhånd. Det vigtigste er, at du tager initiativ og ikke venter på, at andre ordner tingene.

    For os er god stemning ombord alfa og omega. Mango er ikke en partybåd, og hensynet til de andre ombord og vores omgivelser kommer altid først. Med det sagt holder vi selvfølgelig af en kold øl i solen eller en festlig aften, når omgivelserne tillader det.

    Vi er gæster i de lande, vi besøger. Derfor behandler vi lokalbefolkningen, deres kultur og naturen med respekt. Det gælder både på båden og på vores ture i land.
  fremhaevet: Du bliver en del af et fællesskab og kommer hjem med flere oplevelser, erfaringer og venner, end du kan forestille dig.
  billede: /billeder/baal-strand.jpg
oplevelser:
  overskrift: Oplevelser og sejlads
  tekst: |-
    Der er noget særligt ved at ankomme til et nyt land fra søsiden. At se kysten dukke op i horisonten, kaste anker i en bugt og tage dinghyen ind for at udforske et sted, man endnu ikke kender.

    Vi vil gerne opleve mere end de klassiske turiststeder. Måske finder vi en lille restaurant, hvor maden er bedre end udsigten. Måske møder vi andre langturssejlere, bliver inviteret med til noget lokalt eller finder et koralrev, vi bare må tilbage til dagen efter.

    Havet er en stor del af vores rejse. Vi elsker livet både over og under overfladen, men ingen togter er ens. Nogle byder på masser af dykning og snorkling, mens andre tager os på opdagelse på land med vandreture, lokale oplevelser og nye steder at udforske. Vi har ikke behov for at fylde hver eneste dag med aktiviteter fra morgen til aften. Nogle af de bedste oplevelser opstår, når der ikke står noget i kalenderen.
  billede: /billeder/dyk-hjertegrotte.jpg
  billede2: /billeder/dyk-vrag.mp4
  tekst2: |-
    Selve sejladsen er ikke kun transport mellem destinationerne. Du får mulighed for at tage roret, trimme sejl, lære om navigation og deltage i vagter på længere stræk. Har du allerede sejlererfaring, er der selvfølgelig også plads til at bruge den.

    Vi sejler efter vejret, ikke efter en fastlåst rejseplan. Vind, bølger, strøm og bådens tilstand er nogle af de ting, som er med til at bestemme, hvor vi tager hen, hvornår vi sejler, og hvor lang tid turen tager.

    En planlagt destination kan blive skiftet ud med en anden, og en afgang kan blive udskudt, hvis forholdene ikke er gode. Vi kan også blive nødt til at bruge nogle dage på en reparation eller vente på et bedre vejrvindue. Det er en naturlig del af langturssejlads.

    Vi planlægger vores togter, så du ved, hvilket område vi skal opleve, og hvornår du skal være med. Men du skal have lyst til eventyret undervejs og ikke kun én bestemt ø på kortet.
sikkerhed:
  overskrift: Sikkerhed ombord
  tekst: |-
    At tage med på en længere sejltur er en stor beslutning. Du overlader en del af din hverdag og sikkerhed til mennesker, du måske kun lige har mødt. Det ansvar tager vi alvorligt.

    Vi har begge teoretisk og praktisk erfaring med sejlads og livet ombord, og vores tilgang er, at sikkerhed ikke kun handler om udstyret. Det handler mindst lige så meget om forberedelse, gode beslutninger og en besætning, der ved, hvad de laver.

    Inden vi sejler, gennemgår vi bådens sikkerhedsudstyr, de vigtigste procedurer og din rolle ombord. Du skal vide, hvor udstyret er, hvordan du bruger det, og hvad du skal gøre, hvis noget går galt. Vi forventer ikke, at du kan det hele på forhånd, og du må hellere spørge ti gange for meget end én gang for lidt.

    På længere sejladser indgår man som gast i vagtordningen efter en introduktion. Du bliver ikke sat til en opgave, du ikke er blevet klædt på til.

    Vi følger vejrudviklingen, planlægger vores sejladser og tager højde for de forhold, vi møder. Det betyder også, at vi nogle gange bliver liggende, selvom vi alle sammen gerne vil videre. Der er ingen destination, som er vigtigere end at komme sikkert frem.

    Som skippere har vi det overordnede ansvar for båden og træffer de endelige beslutninger om sejlads og sikkerhed. Til gengæld forventer vi, at alle følger sikkerhedsinstruktionerne og siger til, hvis man opdager noget usædvanligt eller føler sig utryg.
  regler_overskrift: Vores klare regler
  regler:
    - Der drikkes ikke alkohol under sejlads.
    - Rusmidler hører ikke til på Mango og medfører øjeblikkelig afmønstring.
    - Rygning er tilladt bagerst på båden, hvor det ikke er til gene for andre.
  efter_tekst: Vi gennemgår også de konkrete regler i informationspakken inden påmønstring, så du ved, hvad du siger ja til. Vi vil gerne have, at du glæder dig til rejsen med sommerfugle i maven frem for med ubesvarede spørgsmål.
oekonomi:
  overskrift: Økonomi og praktisk information
  tekst: |-
    Mango er et privat langtursprojekt, hvor vi deler udgifterne ved at sejle og bo sammen. Som gast betaler du et bidrag til bådens drift og de fælles udgifter under togtet. Det gør det muligt for os at dele eventyret med andre og fortsætte rejsen over længere tid.

    Prisen afhænger af togtets længde og område. Når du kontakter os om et konkret togt, får du oplyst det samlede bidrag, hvad det dækker, og hvilke udgifter du selv skal regne med. Vi ønsker ikke, at du skal stå ombord og være i tvivl om, hvad du har betalt for.
  priser_overskrift: Helt konkret – her er overblikket
  priser:
    - titel: Gastebidrag
      pris: Efter togt
      enhed: Skriv til os for pris
      tekst: Bidraget afhænger af togtets længde og område.
      punkter: []
      fremhaev: false
    - titel: Fællesudgifter
      pris: 4.500 kr.
      enhed: pr. 30 dage (i Caribien)
      tekst: Udgifter, der kan variere meget fra togt til togt, fx
      punkter:
        - Mad og proviantering
        - Brændstof
      fremhaev: true
    - titel: Lommepenge
      pris: 2.000 kr.+
      enhed: pr. 30 dage (anbefalet)
      tekst: Afhænger af dit forbrug – til oplevelser på land og køb, der ikke er en del af fællesbudgettet.
      punkter: []
      fremhaev: false
  selv_overskrift: Det skal du selv stå for inden rejsen
  selv:
    - titel: Flybilletter og transport
      tekst: Prisen afhænger af på- og afmønstringsstedet.
      maerke: ''
    - titel: Rejseforsikring
      tekst: Sørg for, at forsikringen dækker, når du sejler som gast, og at den dækker det område og tidspunkt, du tager afsted.
      maerke: Krav
    - titel: Ansvarsforsikring
      tekst: Ofte kombineret med rejseforsikringen.
      maerke: Krav
    - titel: Ulykkesforsikring
      tekst: Ofte kombineret med rejseforsikringen.
      maerke: Stærkt anbefalet
    - titel: Visa, vaccinationer og personlige udgifter
      tekst: Vi anbefaler også en økonomisk buffer til uforudsete udgifter.
      maerke: ''
  praktisk_overskrift: Godt at vide
  praktisk: |-
    Husk, at en sejlbåd ikke altid kan være præcis det sted, man havde planlagt. Vi aftaler påmønstringsområde på forhånd, men den præcise havn eller ankerplads kan afhænge af vejret og andet. Vent derfor med at bestille transport, der kræver en bestemt ankomsthavn, til vi har koordineret det. 90 % af tiden ligger vi for anker, så du kan forvente, at det sidste stykke af din rejse bliver med vores trofaste dinghy, når vi henter dig på land.

    Livet ombord er forholdsvis simpelt. Vi har begrænset plads, vand og strøm, og man lærer hurtigt, at et langt varmt bad er noget, man finder på land. Til gengæld har vi havet som swimmingpool og en udsigt, der skifter næsten hver dag.

    Du får din egen faste soveplads, men deler resten af bådens faciliteter med de andre gaster og os. Vi hjælpes ad med at holde det rent og rart at være ombord, og alle tager hensyn til, at båden også er vores fælles hjem.

    Du behøver ikke købe en masse dyrt udstyr for at tage med. Inden afrejse modtager du en informationspakke med pakkeliste, praktiske forberedelser, regler og alt det, du skal vide før påmønstring. Her gennemgår vi også de mere detaljerede forhold omkring sikkerhed, forsikring og ansvar.
trin:
  overskrift: Sådan bliver du gast
  tekst: |-
    Vi vil gerne lære dig lidt at kende, inden vi inviterer dig med ombord. Ikke fordi du skal igennem en optagelsesprøve, men fordi det betyder meget for oplevelsen, at vi passer godt sammen som besætning.

    Du behøver hverken sejlerbevis eller tidligere erfaring med langturssejlads. Vi lægger langt større vægt på din indstilling, nysgerrighed og lyst til at være en del af fællesskabet.
  liste:
    - titel: Find dit togt
      tekst: Kig på vores kommende togter og find det område og den periode, der passer dig.
    - titel: Skriv til os
      tekst: Fortæl lidt om dig selv, hvorfor du gerne vil med, og hvad du håber at få ud af rejsen.
    - titel: Videoopkald
      tekst: Vi lærer hinanden bedre at kende, taler om livet ombord og gennemgår dine spørgsmål. Det er også din chance for at mærke efter, om Mango er det rigtige match.
    - titel: Vi aftaler det praktiske
      tekst: Hvis vi alle synes, det lyder som en god idé, aftaler vi plads, betaling og påmønstring.
    - titel: Informationspakken
      tekst: Du modtager den detaljerede informationspakke, så du kan forberede dig ordentligt på rejsen.
  afslutning: Vi forventer ikke, at du kommer ombord som en erfaren sømand. Vi håber bare, at du møder op med et åbent sind, lyst til at lære og mod på at kaste dig ud i noget, der måske ligger lidt uden for din normale hverdag.
faq:
  overskrift: Ofte stillede spørgsmål
  spoergsmaal:
    - spoergsmaal: Skal jeg have sejlet før?
      svar: Nej. Du behøver hverken sejlerbevis eller erfaring med langturssejlads. Vi lærer dig det, du skal bruge, i dit eget tempo.
    - spoergsmaal: Hvad koster det at være gast?
      svar: Gastebidraget afhænger af togtets længde og område – skriv til os, så får du den præcise pris. Derudover er der fællesudgifter på ca. 4.500 kr. pr. 30 dage i Caribien til mad og brændstof.
    - spoergsmaal: Hvor sover jeg?
      svar: Du får din egen faste soveplads i en af bådens fem kahytter. Resten af faciliteterne deler vi.
    - spoergsmaal: Hvordan kommer jeg ud til båden?
      svar: Vi aftaler påmønstringsområdet på forhånd. Da vi oftest ligger for anker, henter vi dig typisk på land med dinghyen. Vent med at bestille transport til en bestemt havn, til vi har koordineret det.
    - spoergsmaal: Hvad hvis vejret ændrer planerne?
      svar: Vi sejler efter vejret, ikke efter en fastlåst plan. En destination kan blive skiftet ud, og en afgang kan blive udskudt – sikkerheden kommer altid først.
    - spoergsmaal: Må man drikke alkohol ombord?
      svar: Ikke under sejlads. Når vi ligger stille, og omgivelserne tillader det, nyder vi gerne en kold øl i solen.
    - spoergsmaal: Hvad skal jeg pakke?
      svar: Inden afrejse får du en informationspakke med pakkeliste og alt det praktiske. Du behøver ikke købe dyrt udstyr.
