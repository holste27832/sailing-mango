top:
  overskrift: Båden
  undertekst: Mango er både vores eventyrskane, mindemagnet og det perfekte værested for os under hele rejsen.
  video: /billeder/mango-rev-drone.mp4
  billede: /billeder/mango-rev-poster.jpg
afsnit:
  - overskrift: Plads til at bo sammen
    tekst: |-
      Hun er en tysk-bygget 50-fods sejlbåd, lavet til netop den måde, vi sejler hende på. Med en længde på 15 meter er der plads til, at vi kan bo mange mennesker sammen i længere tid uden at føle, at vi sidder oven på hinanden hele tiden.

      Der er fem kahytter, tre toiletter og masser af plads til både fællesskab og de øjeblikke, hvor man bare gerne vil finde et roligt hjørne med en bog.
    billede: /billeder/mango-daek.jpg
  - overskrift: Bygget til at føle sig tryg
    tekst: |-
      Da vi kiggede efter den rette båd, gik vi efter en båd, vi ville føle os trygge i – og med den måde Mango er bygget på, sover vi godt om natten, selv på længere sejladser.

      Båden er konstrueret med et håndlamineret skrog, solid laminat under vandlinjen og sandwichkonstruktion over vandlinjen. I stævnen er skroget desuden forstærket med Kevlar – en detalje, der er rar at vide, når man skal tilbringe mange timer på havet. Mango har en tung bly-køl, som giver stabilitet i bølger.
    billede: /billeder/mango-havn.jpg
  - overskrift: Selvforsynende ude på havet
    tekst: |-
      Mango har derudover en opgraderet udstyrspakke, som gør livet ombord til en fornøjelse. Med en stor lithium-batteribank og ca. 2.500 W solceller kan vi producere vores egen strøm uden at skulle være nervøse for ikke at kunne lade vores devices, når solen ikke skinner.

      Vores watermaker, som laver saltvand om til drikkevand, gør, at vi kan ligge fredeligt ved øde ankerbugter og øer uden at stresse over at skulle i land og tanke op. Alle kahytter har fungerende stikkontakter og faste blæsere i topkvalitet – en af de mange opgraderinger, vi ikke er gået på kompromis med.
    billede: /billeder/mango-drone.jpg
  - overskrift: Dinghyen – vores lille bil
    tekst: Og så har vi en dinghy med 20 hk motor. Det lyder måske som en lille detalje, men når vi ligger for anker 95 % af tiden, bliver den hurtigt til vores lille bil – den bringer os i land, ud til snorkelsteder, på indkøb, på dinghy-dates og på opdagelse i de små bugter omkring os.
    billede: /billeder/mango-dinghy.jpg
