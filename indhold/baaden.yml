bygget:
  overskrift: Bygget til livet på havet
  tekst: |-
    Mango er ikke en luksusyacht, og det er heller ikke meningen. Der kommer saltvand på dækket, sand på gulvet, og ting kan gå i stykker. Vi passer på båden så godt, vi kan, men vi ved også godt, at båden og udstyret er til for at blive brugt – så vi behandler den ikke som et museum.

    Mango er altså vores flydende og selvforsynende hjem med plads til hele besætningen og en garanti for hyggelige stunder og minder, man ikke glemmer. Den skaber de perfekte rammer for vores ønske om at have sikkerheden i orden og humøret i top.
  billede: /billeder/mango-sejler.jpg
